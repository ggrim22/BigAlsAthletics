{# Shared confirm-delete dialog on the charcoal modal shell. #}
<form class="modal-content product-modal choice-modal" hx-post="{{ request.path }}">
  {% csrf_token %}
  <div class="modal-header product-modal__header">
    <div>
      <p class="product-modal__eyebrow">{{ eyebrow }}</p>
      <h5 class="modal-title">{{ title }}</h5>
    </div>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>

  <div class="modal-body product-modal__body">
    <section class="product-modal__section product-modal__danger">
      <div class="product-modal__danger-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
      </div>
      <div>
        <h6>Delete {{ object_label }}?</h6>
        <p class="mb-0">
          <strong>{{ object_name }}</strong> will be removed permanently. This cannot be undone.
        </p>
      </div>
    </section>
  </div>

  <div class="modal-footer product-modal__footer">
    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-danger px-4">Delete</button>
  </div>
</form>
