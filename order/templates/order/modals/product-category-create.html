{% load crispy_forms_tags %}

<form hx-post="{{ request.path }}" class="modal-content product-modal choice-modal" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="modal-header product-modal__header">
    <div>
      <p class="product-modal__eyebrow">Catalog option</p>
      <h5 class="modal-title">Add a category</h5>
    </div>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>
  <div class="modal-body product-modal__body">
    {{ form.name|as_crispy_field }}
    {{ form.active|as_crispy_field }}
  </div>
  <div class="modal-footer product-modal__footer">
    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-dark px-4">Add category</button>
  </div>
</form>
