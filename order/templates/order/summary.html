{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}


{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 sm:mt-12">

  <div class="flex flex-wrap justify-between items-center gap-3 mb-4">

    <h2 class="text-3xl font-semibold text-zinc-100">Order Summary</h2>

    <div class="flex items-center space-x-3">
          <form id="filter-form"
                method="get"
                hx-get="{% url 'order:summary' %}"
                hx-target="#summary-table"
                hx-trigger="change"
                class="flex items-center gap-2">

              {{ filter_form.collection }}
              {{ filter_form.product_name }}
          </form>

          <a id="download-btn"
             href="{% url 'order:order_summary_download' %}"
             class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-lg transition-colors">
            Download
          </a>
      </div>
    </div>
  </div>


<div class="" id="summary-table">
  {% include 'order/partials/_summary-table.html' %}
</div>

<script src="{% static 'js/download.js' %}" nonce="{{ request.csp_nonce }}"></script>

{% endblock %}
