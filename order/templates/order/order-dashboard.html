{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}

<style>
  /* The Player Name column is hidden until the toggle below is checked.
     Pure CSS, so it needs no JavaScript bundle, works on HTMX-appended
     rows with no re-sync, and cannot break if a stale static file is served. */
  .player-name-column { display: none; }
  body:has(#playerNameToggle:checked) .player-name-column { display: table-cell; }
</style>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 sm:mt-12">
  <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
    <h3 class="text-2xl font-semibold">Order Dashboard</h3>
    <div class="flex gap-3">
      <a href="{% url 'order:order_download' %}"
        class="px-4 py-2 bg-zinc-700 text-white
               hover:bg-zinc-600 rounded-lg transition cursor-pointer">
        Download
      </a>
      <a href="{% url 'order:summary' %}"
        class="px-4 py-2 bg-zinc-700 text-white
               hover:bg-zinc-600 rounded-lg transition cursor-pointer">
        See Details
      </a>
    </div>
  </div>

  <!-- Table Toggles and Archived Orders Link -->
  <div class="mb-4 flex flex-wrap justify-between items-center gap-3">
    <div class="flex items-center gap-6">
      <label class="flex items-center gap-3 cursor-pointer">
        <input
          type="checkbox"
          id="editModeToggle"
          class="w-5 h-5 accent-zinc-400 cursor-pointer"
        >
        <span class="text-lg font-semibold text-zinc-300">Edit Mode</span>
      </label>

      {% if has_player_names %}
        <label class="flex items-center gap-3 cursor-pointer">
          <input
            type="checkbox"
            id="playerNameToggle"
            class="w-5 h-5 accent-zinc-400 cursor-pointer"
          >
          <span class="text-lg font-semibold text-zinc-300">Player Names</span>
        </label>
      {% endif %}
    </div>
    <a href="{% url 'order:archived_orders' %}"
       class="px-4 py-2 bg-zinc-700 text-zinc-100 hover:bg-zinc-600 hover:text-white rounded-lg transition">
      View Archived Orders
    </a>
  </div>

  <div hx-trigger="load, order-items-updated from:body"
       hx-get="{% url 'order:order_list' %}">
  </div>

</div>

{% endblock %}
