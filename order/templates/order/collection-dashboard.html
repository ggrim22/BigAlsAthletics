{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 sm:mt-12">
  <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
    <h3 class="text-2xl font-semibold mb-0">Collection Dashboard</h3>
    <div class="flex gap-2">
      <a hx-get="{% url 'order:collection_create' %}" hx-target="#dialog" class="px-4 py-2 bg-zinc-800 text-zinc-100 hover:bg-zinc-700 rounded-lg transition cursor-pointer">Create Collection</a>
    </div>
  </div>
</div>
<div hx-trigger="load, collections-updated from:body" hx-get="{% url 'order:collection_list' %}"></div>
{% endblock %}
